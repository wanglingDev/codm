plugins {
    id 'com.android.application'
}
android {
    compileSdk 33
    defaultConfig {
        applicationId "com.gaeris.injector"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
        // 64-bit only — matches CODM Garena arm64 build
        ndk { abiFilters "arm64-v8a" }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation 'androidx.core:core:1.9.0'
}
